function hurtP(id,d){if(id===me)hurt(d);else{const s=pres(id);HP[id]=Math.max(0,(HP[id]??P.max)-d*(1-((s&&s.ar)||0)))}}
function roles(){const by=(a,b)=>a.peer<b.peer?-1:1,ps=NR.peers().filter(p=>p.presence&&p.presence.cfg),m=ps.find(p=>p.isMe&&p.sameTab);if(m)me=m.peer;
 const h=ps.filter(p=>p.presence.host).sort(by)[0];
 if(!h){const low=ps.slice().sort(by)[0];if(low&&low.isMe&&low.sameTab)isHost=true;return null}
 const was=isHost;isHost=h.isMe&&h.sameTab;
 if(was&&!isHost)NR.presence({host:null,en:null,pk:null,ph:null,wv:null,rem:null,phs:null,nt:null,kt:null,df:null,go:null,hz:null,fg:null,rv:null});
 return isHost?null:h.presence}
function syncAv(dt){const seen={};for(const p of NR.peers()){const s=p.presence;if(p.isMe||!s||!s.cfg)continue;seen[p.peer]=1;let a=AV[p.peer];
 if(!a){const c=s.cfg;a={m:human({g:c.g,shirt:c.s,hair:c.h,skin:c.k},false),x:s.x||0,z:s.z||0,fc:s.fc||0};S.add(a.m.g);AV[p.peer]=a}
 const k=Math.min(1,dt*14);a.x+=((s.x||0)-a.x)*k;a.z+=((s.z||0)-a.z)*k;const g=a.m.g;g.position.set(a.x,s.dead?.3:0,a.z);g.rotation.y=s.a||0;g.rotation.x=s.dead?-1.4:0;
 const w=s.mv?Math.sin(T*11)*.8:0;a.m.legs[0].rotation.x=w;a.m.legs[1].rotation.x=-w;
 if(s.fc>a.fc){for(let i=0,n=Math.min(4,s.fc-a.fc);i<n;i++)volley({x:s.x,z:s.z,a:s.a,w:s.w||0,l:s.l||0},isHost);a.fc=s.fc}else a.fc=s.fc||0}
 for(const id in AV)if(!seen[id]){S.remove(AV[id].m.g);delete AV[id]}}
function pub(dt){pubT+=dt;if(pubT<.05)return;pubT=0;
 const pr={ar:+arm().toFixed(2),su:G.suit?1:0,ux:Math.round(UXs),x:+P.x.toFixed(1),z:+P.z.toFixed(1),a:+P.ang.toFixed(2),fc,w:G.eq,l:G.lv[G.eq],mv:curMv,dead:P.hp<=0?1:0};
 if(isHost){pr.host=1;pr.en=E.slice(0,60).map(e=>[e.id,+e.x.toFixed(1),+e.z.toFixed(1),e.t]);pr.pk=Pk.map(k=>[+k.x.toFixed(1),+k.z.toFixed(1)]);pr.ph={...HP,[me]:Math.round(P.hp)};
  pr.wv=wave;pr.rem=toSpawn;pr.phs=waveDone?1:0;pr.nt=Math.ceil(nextT);pr.kt=KT;pr.df=cfg.d;pr.go=ovr?1:0;pr.hz=H.slice(0,12).map(h=>[h.id,h.k,+h.x.toFixed(1),+h.z.toFixed(1),+(h.t||0).toFixed(1)]);pr.fg=fgT>0?1:0;pr.rv=rvT>0?1:0;pr.hn=hzn;pr.ht=hzt}
 NR.presence(pr).catch(()=>{})}
function step(dt){
 let hs=null;if(mp){hs=roles();syncAv(dt);if(needInit){if(isHost){needInit=false;nextT=45}else if(hs)needInit=false}}
 const host=!mp||isHost,dead=P.hp<=0;
 let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(st.l.id!==null){mx+=st.l.dx;mz+=st.l.dy}
 let ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}if(rvOn&&!G.suit){mx=-mx;mz=-mz}if(dead){mx=mz=ml=0}
 P.x=clamp(P.x+mx*7*dt,-38.5,38.5);P.z=clamp(P.z+mz*7*dt,-38.5,38.5);push(P,.5);curMv=ml>.1?1:0;
 let fire=false;
 if(!dead){
  if(st.r.id!==null){if(Math.hypot(st.r.dx,st.r.dy)>.2){P.ang=Math.atan2(st.r.dx,st.r.dy);fire=true}}
  else if(hasMouse){rc.setFromCamera(mouse,cam);if(rc.ray.intersectPlane(plane,pt3))P.ang=Math.atan2(pt3.x-P.x,pt3.z-P.z);fire=mdown||keys[' ']}
  else if(ml>.1&&!touchDev)P.ang=Math.atan2(mx,mz);
  if(!fire&&!hasMouse&&st.r.id===null&&(cfg.d===0||keys[' '])){let bd=15,be=null;for(const e of E){const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<bd){bd=d;be=e}}if(be){P.ang=Math.atan2(be.x-P.x,be.z-P.z);fire=true}}
  P.cd-=dt;if(fire&&P.cd<=0)shoot()}
 mflash.intensity=Math.max(0,mflash.intensity-dt*30);
 pm.g.position.set(P.x,dead?.3:Math.abs(Math.sin(T*11))*.06*ml,P.z);pm.g.rotation.y=P.ang;pm.g.rotation.x=dead?-1.4:0;pm.legs[0].rotation.x=Math.sin(T*11)*.8*ml;pm.legs[1].rotation.x=-Math.sin(T*11)*.8*ml;
 /* wave logic: host / solo only */
 if(host){hostExtras(dt);
  if(toSpawn>0&&!waveDone){spawnT-=dt;if(spawnT<=0&&E.length<cap()){spawnT=Math.max(.3,.9/dd.c-wave*.03);spawn();toSpawn--}}
  else if(!waveDone&&toSpawn<=0&&!E.length){waveDone=true;gain(wave*100);P.hp=P.hp>0?Math.min(P.max,P.hp+25):0;for(const k in HP)if(HP[k]>0)HP[k]=Math.min(P.max,HP[k]+25);wave++;nextT=25;if(wave>300&&!ovr){ovr=true;gameOver()}}
  if(waveDone){nextT-=dt;if(nextT<=0)startWave(wave)}
 }else if(hs){wave=hs.wv||1;toSpawn=hs.rem||0;waveDone=!!hs.phs;nextT=hs.nt||0;dd=D[hs.df||0];P.max=dd.hp+G.hpb*25;
  const ph=hs.ph||{};if(ph[me]!=null&&T>healT){if(ph[me]<lastHp-.5)hurtFx();P.hp=ph[me];lastHp=P.hp}HP={...ph};delete HP[me];
  const kt=hs.kt||0;if(lastKt==null)lastKt=kt;if(kt>lastKt){G.coins+=kt-lastKt;score+=kt-lastKt;lastKt=kt}
  const em=new Map(E.map(e=>[e.id,e])),seen=new Set();
  for(const[id,x,z,t]of hs.en||[]){seen.add(id);let e=em.get(id);if(!e)e=mkE(t,x,z,id);e.tx=x;e.tz=z}
  E=E.filter(e=>{if(seen.has(e.id))return true;burst(e.x,1.2,e.z,10);S.remove(e.m.g);return false});
  const key=JSON.stringify(hs.pk||[]);if(key!==pkKey){pkKey=key;Pk.forEach(k=>S.remove(k.m));Pk=(hs.pk||[]).map(([x,z])=>{const m=new THREE.Mesh(kg,kmat);m.position.set(x,.6,z);S.add(m);return{m,x,z}})}
  if(hs.go)gameOver()}
 if(mp&&host){if(lastKt==null)lastKt=0;if(KT>lastKt){G.coins+=KT-lastKt;score+=KT-lastKt;lastKt=KT}}
 if(waveDone!==shopWas){shopWas=waveDone;if(waveDone){shopOpen();banner(wave<=1?'出發前準備：先買補給吧':`第 ${wave-1} 波完成！`);save()}else{$('shop').style.display='none';banner(`第 ${wave} 波${wave%5===0?'・首領來襲！':''}`)}}
 /* bullets */
 for(const b of Bu){b.m.position.x+=b.vx*dt;b.m.position.z+=b.vz*dt;b.l-=dt;
  for(const e of E){if(e.dead||b.hit.has(e))continue;const dx=b.m.position.x-e.x,dz=b.m.position.z-e.z;if(dx*dx+dz*dz<(e.r+.3)**2){b.hit.add(e);if(b.pc>0)b.pc--;else b.l=0;burst(e.x,1.5,e.z,3);snd(200,.06,'triangle',.03);
   if(b.real&&host){dmgE(e,b.dm);e.x+=b.vx*.01;e.z+=b.vz*.01;if(b.ex){for(const f of E)if(f!==e&&!f.dead&&Math.hypot(f.x-e.x,f.z-e.z)<b.ex)dmgE(f,b.dm*.6);burst(e.x,1,e.z,24);shake=.25}}
   if(b.l<=0)break}}}
 Bu=Bu.filter(b=>{if(b.l>0)return true;S.remove(b.m);return false});
 E=E.filter(e=>{if(!e.dead)return true;S.remove(e.m.g);return false});
 /* enemy AI: host / solo only */
 if(host){const TG=targets();
  for(let i=0;i<E.length;i++){const e=E[i];let b=null,bd=1e9;for(const t of TG){const d=Math.hypot(t.x-e.x,t.z-e.z);if(d<bd){bd=d;b=t}}
   if(b){const d=bd||1;e.x+=(b.x-e.x)/d*e.sp*dt*dd.es;e.z+=(b.z-e.z)/d*e.sp*dt*dd.es;e.cd-=dt;if(bd<e.r+.8&&e.cd<=0){e.cd=.9;hurtP(b.id,e.dmg*dd.d)}}
   for(let j=i+1;j<E.length;j++){const f=E[j],ax=e.x-f.x,az=e.z-f.z,ad=Math.hypot(ax,az),mn=e.r+f.r;if(ad<mn&&ad>0){const p=(mn-ad)/2;e.x+=ax/ad*p;e.z+=az/ad*p;f.x-=ax/ad*p;f.z-=az/ad*p}}
   push(e,e.r)}
  for(const k of Pk)for(const t of TG)if(Math.hypot(k.x-t.x,k.z-t.z)<1.5){k.got=true;snd(700,.2,'sine',.05);if(t.id===me){P.hp=Math.min(P.max,P.hp+25);banner('+25 生命')}else HP[t.id]=Math.min(P.max,(HP[t.id]||0)+25);break}
  Pk=Pk.filter(k=>{if(!k.got)return true;S.remove(k.m);return false});
  if(mp&&!ovr&&!TG.length&&E.length+toSpawn>=0&&state==='play'){ovr=true;gameOver()}}
 hazFx(dt,host,hs);
  /* shared animation */
 E.forEach((e,i)=>{if(!host){const k=Math.min(1,dt*12);e.x+=(e.tx-e.x)*k;e.z+=(e.tz-e.z)*k}
  const dx=e.x-(e.px??e.x),dz=e.z-(e.pz??e.z);if(dx*dx+dz*dz>1e-6)e.ry=Math.atan2(dx,dz);e.px=e.x;e.pz=e.z;
  e.m.g.position.set(e.x,0,e.z);e.m.g.rotation.y=e.ry||0;const w=Math.sin(T*8+i)*.7;e.m.legs[0].rotation.x=w;e.m.legs[1].rotation.x=-w;e.m.arms[0].rotation.x=e.m.arms[1].rotation.x=-1.4+Math.sin(T*5+i)*.15});
 for(const k of Pk){k.m.rotation.y+=dt*2;k.m.position.y=.7+Math.sin(T*3)*.15}
 for(const p of Pa){p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.vy-=15*dt;p.l-=dt;p.m.scale.setScalar(Math.max(.01,p.l*2))}
 Pa=Pa.filter(p=>{if(p.l>0&&p.m.position.y>0)return true;S.remove(p.m);return false});
 $('hpb').style.width=P.hp/P.max*100+'%';$('hpt').textContent=Math.ceil(P.hp)+' / '+P.max;
 $('wv').textContent=waveDone?(wave<=1?'出發前準備':`第 ${wave-1} 波完成`):`第 ${wave}/300 波・剩 ${E.length+toSpawn}`+(mp?`・${np()}人`:'');
 $('sc').textContent=score+' 分・'+G.coins+' 金幣';
 if(waveDone){$('nb').textContent=wave<=1?'直接出發（第 1 波）':'開始下一波';$('nxt').textContent=(nextT>200?'準備好了就按開始':`下一波倒數 ${Math.max(0,Math.ceil(nextT))} 秒`)+(mp&&!isHost?'（由房主開始）':'');$('coin').textContent=G.coins}
 if(dead&&mp&&state==='play')$('hurt').style.opacity=.35;
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-(loop.l||now))/1000);loop.l=now;T+=dt;
 if(state==='menu'){pm.g.rotation.y=T*.7;pm.legs.forEach(l=>l.rotation.x=0)}
 else{if(state==='play')step(dt);if(mp&&NR&&state!=='menu')pub(dt);
  const k=innerWidth<innerHeight?1.4:1;shake=Math.max(0,shake-dt*1.5);
  cam.position.lerp(new THREE.Vector3(P.x,15*k,P.z+11*k),Math.min(1,dt*6));cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;cam.lookAt(P.x,.5,P.z);
  moon.position.set(P.x-20,40,P.z+15);moon.target.position.set(P.x,0,P.z)}
 R.render(S,cam)}
resize();rebuild();ui();menuCam();moon.position.set(-20,40,15);requestAnimationFrame(loop);
</script></body></html>
